# Build variants shared by the recipes (caliper, gslib, mfem, reflect-cpp).
# Each recipe directory links its variants.yaml here, so a plain
# `rattler-build build --recipe <name>` picks them up.

# The C standard library the packages are built against: conda-forge's
# sysroot with glibc 2.28 on linux (runs on DTU's 2.34 and LUMI's SLES 15
# 2.31; the build machine's newer glibc made libmfem need 2.35 and
# libcaliper 2.38, 2026-10-28), and the macOS deployment target. stdlib('c')
# also adds the matching __glibc / __osx run requirement.
c_stdlib:
  - if: linux
    then: sysroot
  - if: osx
    then: macosx_deployment_target
c_stdlib_version:
  - if: linux
    then: "2.28"
  - if: osx
    then: "11.0"
#
# MPI implementation. Enabling LUMI (Cray MPICH, docs/cluster-io-plan.md) is
# the one line `- mpich`: every MPI recipe then builds a second variant
# against conda-forge's mpich, whose run_exports select it at install time.
mpi:
  - openmpi

# x86-64 microarchitecture level of mfem-hodgles (conda-forge's microarch-level
# helper, knowledge base "Microarchitecture-optimized builds"): a generic
# build and an x86-64-v3 (AVX2, FMA) build on linux-64; the solver prefers
# the v3 build (higher build number) where __archspec allows it. Only the
# mfem recipe uses this key; osx-arm64 builds once.
microarch_level:
  - 1
  - if: linux and x86_64
    then: 3

# GPU backend of mfem-hodgles (docs/feasibility/gpu.md in hodgles): none, and
# on linux-64 a CUDA build against hypre-cuda. The CUDA build has a lower
# build number than every CPU build and needs __cuda, so an environment gets
# it only by asking for it (mfem-hodgles build "cuda*"). Only mfem uses this
# key; it builds CUDA at microarch level 3 only.
gpu:
  - none
  - if: linux and x86_64
    then: cuda

# CUDA toolkit of hypre-cuda and the CUDA mfem-hodgles (conda-forge's
# cuda-version). 12.9 runs on drivers >= 525 (minor-version compatibility)
# and still targets Volta; CUDA 13 needs drivers >= 580.
cuda_version:
  - "12.9"

# GPU architectures compiled as SASS (no PTX, as MFEM's -gencode does):
# 80 A100/A30, 90 H100/H200. Add the target's compute capability
# (nvidia-smi --query-gpu=compute_cap) before building for another GPU;
# each entry adds roughly one full device compile.
cuda_arch:
  - "80;90"
